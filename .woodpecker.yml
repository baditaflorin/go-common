# Woodpecker CI (services-registry ADR-0035). go-common is a library rather
# than a deployable container, so its gate covers the root Go module and has
# no container/compose smoke stage.
#
# Pipelines run for pull requests, and for pushes to main; a push to a PR branch
# is covered by its PR run, so each change is built once, not twice.
#
# The steps form a graph (depends_on), not a queue: they run side by side, so a
# pipeline takes about as long as its slowest step rather than the sum of them. The
# agent runs one workflow at a time but all of a workflow's steps at once, and it is
# shared with the fleet's other pull requests, so keep a new step light or make it
# wait for one that is done. `validate` keeps its original name and commands so
# anything keyed on it is unaffected; the rest were added by the hardening work
# (race, lint, vuln, forward compatibility, API compatibility, benchmarks, release
# number, fuzz smoke, package index). Tool versions
# live in scripts/tool-versions.sh, except the lint image tag below, which has to
# be kept equal to GOLANGCI_LINT_VERSION by hand.
# Woodpecker's default clone is shallow (depth 1) and treeless. That has no HEAD^
# and no merge base, so the lint, API and benchmark checks cannot find what to
# compare with. A full clone fixes that; this is the same clone block other
# repos on this server use.
clone:
  git:
    image: quay.io/woodpeckerci/plugin-git:2.9.2
    settings:
      partial: false

steps:
  # The clone holds the commit and its history but no other branch and no tag. Every
  # step that compares with the target branch or reads the tags needs them, and several
  # `git fetch` into one repository at once can fail on a ref lock, so this one step
  # fetches them and those steps wait for it (depends_on: [refs]). A push needs only
  # HEAD^, which the clone has. The fetch is tried three times: a refused connection
  # should not fail five steps.
  refs:
    image: golang:1.26
    commands:
      - git config --global --add safe.directory '*'
      - |
        if [ "$CI_PIPELINE_EVENT" = "pull_request" ]; then
          for attempt in 1 2 3; do
            git fetch -q --tags origin "+refs/heads/$CI_COMMIT_TARGET_BRANCH:refs/remotes/origin/$CI_COMMIT_TARGET_BRANCH" && exit 0
            sleep $((attempt * 2))
          done
          echo "refs: cannot fetch $CI_COMMIT_TARGET_BRANCH from origin" >&2
          exit 1
        fi
    when:
      - event: pull_request
      - event: push
        branch: main

  validate:
    image: golang:1.26
    environment:
      CGO_ENABLED: "0"
    commands:
      - test -z "$(gofmt -l .)"
      - go vet ./...
      - go test -count=1 ./...
      - go build ./...
      # Every package needs a doc comment, and docs/PACKAGES.md must match them.
      - go run ./scripts/pkgindex -check
      # fuzz.sh retries the Go fuzz engine's spurious timeout; prove it still does.
      - scripts/fuzz-selftest.sh
      # docs/ENV.md must match the variables the packages declare.
      - go run ./scripts/envdoc -check
      # A budgeted small package may not gain a third-party module (scripts/dep-budget.txt),
      # and docs/dependencies.md must match what the packages import.
      - scripts/dep-budget-selftest.sh && scripts/dep-budget.sh && scripts/dep-budget.sh --check-doc
      # forward-compat.sh edits only a copy, passes the go line it was given and fails when
      # the tests do.
      - scripts/forward-compat-selftest.sh
      # fuzz-changed.sh hands scripts/fuzz.sh the packages a change touches, and every package
      # when it cannot tell.
      - scripts/fuzz-changed-selftest.sh
      # coverage-ratchet.sh reads the floors, fails below one, raises them and never lowers them.
      - scripts/coverage-ratchet-selftest.sh
    when:
      - event: pull_request
      - event: push
        branch: main

  # Data races. -race needs cgo, so this step cannot share validate's CGO_ENABLED=0.
  race:
    image: golang:1.26
    environment:
      CGO_ENABLED: "1"
    commands:
      - go test -race -count=1 ./...
    when:
      - event: pull_request
      - event: push
        branch: main

  # Only findings in code this change touches fail the step; the legacy findings
  # do not block anyone. A PR is compared with the merge base with its target
  # branch (not the branch tip, which may have moved on; `refs` fetched it), a push
  # with the previous commit. lint/selftest.sh proves the shared consumer config in
  # lint/ still fires.
  lint:
    # golangci-lint v2.14.0, pinned by digest.
    image: golangci/golangci-lint:v2.14.0@sha256:ad862ba6b3798cbe0fd9fd7408d498fd74fbd2623a92406b2fd3898faf0bf98f
    commands:
      - git config --global --add safe.directory '*'
      - |
        if [ "$CI_PIPELINE_EVENT" = "pull_request" ]; then
          golangci-lint run --new-from-merge-base="origin/$CI_COMMIT_TARGET_BRANCH" ./...
        else
          golangci-lint run --new-from-rev=HEAD^ ./...
        fi
      - lint/selftest.sh
    depends_on: [refs]
    when:
      - event: pull_request
      - event: push
        branch: main

  # Fails on a reachable vulnerability that is not in scripts/govulncheck-allow.txt,
  # or whose allowlist entry has expired. Runs on a supported Go (1.26): on 1.25,
  # which no longer gets security fixes, unfixable standard-library findings would
  # hide the module findings that are go-common's own to fix. A red step on an
  # unrelated change means main itself has a new vulnerability: fix that first.
  vuln:
    # An exact patch, not golang:1.26: the agents hold different 1.26 patches, and
    # govulncheck's standard-library findings change between them, so a floating
    # tag can pass on one agent and fail on another. Bump it with the Go patch
    # release (and look at scripts/govulncheck-allow.txt when you do).
    image: golang:1.26.9
    environment:
      CGO_ENABLED: "0"
    commands:
      - scripts/vuln-check.sh
    when:
      - event: pull_request
      - event: push
        branch: main

  # Forward compatibility: go-common's own go vet and tests with a temporary newer
  # `go` line, in a copy of the tree (scripts/forward-compat.sh; docs/releasing.md says
  # what to do when it fails). Go takes the default of each GODEBUG setting from the
  # `go` line of the module it builds, not from the toolchain, so the steps above run
  # with the 1.26 defaults on any image; this is the only step that sees what Go
  # changes for a newer line before go-common's minimum Go moves. The image must
  # provide the minor version in FORWARD_COMPAT_GO_MINOR (scripts/tool-versions.sh),
  # which the script uses when it is given no argument. An exact patch, as in `vuln`.
  # Blocking: a failure means the code is wrong under a newer Go's defaults.
  forward-compat:
    image: golang:1.27.2
    environment:
      CGO_ENABLED: "0"
    commands:
      - scripts/forward-compat.sh
    when:
      - event: pull_request
      - event: push
        branch: main

  # An incompatible exported-API change must be declared BREAKING in CHANGELOG.md.
  # See docs/api-policy.md.
  api:
    image: golang:1.26
    environment:
      CGO_ENABLED: "0"
    commands:
      - git config --global --add safe.directory '*'
      - scripts/apidiff-check.sh
    depends_on: [refs]
    when:
      - event: pull_request
      - event: push
        branch: main

  # A hot-path benchmark must not start allocating more: allocs/op is compared
  # with the merge base (see scripts/bench-gate.sh for why not ns/op).
  bench:
    image: golang:1.26
    environment:
      CGO_ENABLED: "0"
    commands:
      - git config --global --add safe.directory '*'
      - scripts/bench-gate.sh
    depends_on: [refs]
    when:
      event: [pull_request]

  # The version this change claims in CHANGELOG.md must be the next free one.
  release:
    image: golang:1.26
    commands:
      - git config --global --add safe.directory '*'
      - scripts/release-check.sh
    depends_on: [refs]
    when:
      event: [pull_request]

  # A short mutation run of Fuzz targets. The seed corpus (including every
  # committed crash) already runs in `go test`; this is the part that mutates.
  # A pull request fuzzes only the targets of the packages it touches
  # (scripts/fuzz-changed.sh: about half of a pipeline was a full run, and most changes
  # touch no fuzzed package); a push to main fuzzes every target, so each one is
  # mutated at least once per merge. Long runs belong in a nightly job (scripts/fuzz.sh
  # 5m), which needs a cron schedule set on the Woodpecker server.
  fuzz:
    image: golang:1.26
    environment:
      CGO_ENABLED: "0"
    commands:
      - git config --global --add safe.directory '*'
      - |
        if [ "$CI_PIPELINE_EVENT" = "pull_request" ]; then
          scripts/fuzz-changed.sh 5s
        else
          scripts/fuzz.sh 5s
        fi
    depends_on: [refs]
    when:
      - event: pull_request
      - event: push
        branch: main

  # Per-package coverage floors (coverage/floors.txt, coverage/README.md): a package whose
  # statement coverage falls below its floor, or a tested package with no floor, fails. The
  # floors are measured minus 2 points and only ever go up. It is another full test run
  # (about 450 CPU-seconds) on an agent shared with the fleet's pull requests, so it runs on
  # pushes to main only, not on every pull request: run scripts/coverage-ratchet.sh by hand
  # before a change that removes or rewrites tests. A nightly run would be `event: cron`, but
  # the schedule is repository configuration on the Woodpecker server, so none is added here.
  coverage:
    image: golang:1.26
    environment:
      CGO_ENABLED: "0"
      # "1" prints the table and the verdict but never fails: the switch for a floor that
      # blocks work it should not, until the floors are fixed.
      COVERAGE_ADVISORY: "0"
    commands:
      - scripts/coverage-ratchet.sh
    depends_on: [validate]
    when:
      - event: push
        branch: main
